# Auto-deploy the Worker on push to the deploy branch (TASKS.md T60).
# Required repo secrets (see docs/deployment.md "CI 自动部署"):
#   CF_API_TOKEN      – Cloudflare API token, Workers Scripts:Edit
#                       (+ KV Storage:Edit if you let CI create the namespace,
#                        + Zone/Workers Routes:Edit once the custom domain is enabled)
#   CF_ACCOUNT_ID     – Cloudflare account id
#   CF_RATE_LIMIT_SALT– random string (>=32 chars) injected as the Worker secret RATE_LIMIT_SALT
# The KV namespace id lives in wrangler.jsonc (not secret — useless without the API token).
# The account id is injected via the CLOUDFLARE_ACCOUNT_ID secret at deploy time only.
name: Deploy CF Worker

on:
  push:
    branches: [develop]
    paths-ignore: ['docs/**', 'evidence/**', '**/*.md', '.github/**']
  workflow_dispatch: {}

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Worker unit + e2e gate (backend-free)
        run: |
          npm run test:worker
          npm run test:worker:e2e

      - name: Config gate (dry-run, no credentials needed)
        run: |
          npx wrangler deploy --dry-run --outdir=dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Inject RATE_LIMIT_SALT secret (takes effect immediately, no redeploy)
        run: printf '%s' "$CF_RATE_LIMIT_SALT" | npx wrangler secret put RATE_LIMIT_SALT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_RATE_LIMIT_SALT: ${{ secrets.CF_RATE_LIMIT_SALT }}

      - name: Health probe (optional — set the CF_DEPLOY_URL variable to enable)
        if: vars.CF_DEPLOY_URL != ''
        run: |
          sleep 10
          curl -fsS "${{ vars.CF_DEPLOY_URL }}/api/health"
